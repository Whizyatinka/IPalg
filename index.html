<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Graham Scan Visualizer</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; }
        canvas { background: white; border: 2px solid #333; cursor: crosshair; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .controls { margin-top: 15px; width: 600px; display: flex; justify-content: space-between; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        #clearBtn { background-color: #9e9e9e; color: white; }
        #stepBtn { background-color: #2196F3; color: white; margin-right: 10px; }
        #resultBtn { background-color: #4CAF50; color: white; }
        .right-btns { display: flex; }
    </style>
</head>
<body>
    <h2>Алгоритм Грэхема</h2>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="controls">
        <button id="clearBtn">Очистить поле</button>
        <div class="right-btns">
            <button id="stepBtn">Сделать шаг</button>
            <button id="resultBtn">Результат</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let points = [], stack = [], sortedPoints = [], currentIdx = 0, isFinished = false;

    function getOrientation(p, q, r) {
        const val = (q.y - p.y) * (r.x - q.x) - (q.x - p.x) * (r.y - q.y);
        if (Math.abs(val) < 1e-9) return 0;
        return (val > 0) ? 1 : 2;
    }

    function distSq(p1, p2) {
        return (p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2;
    }

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        points.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
        resetAlgorithm();
        draw();
    });

    document.getElementById('clearBtn').onclick = () => {
        points = [];
        resetAlgorithm();
        draw();
    };

    document.getElementById('resultBtn').onclick = () => {
        if (points.length < 3) return;
        resetAlgorithm();
        preparePoints();
        while (!isFinished) step();
        draw();
    };

    document.getElementById('stepBtn').onclick = () => {
        if (points.length === 0) return;
        if (sortedPoints.length === 0) preparePoints();
        step();
        draw();
    };

    function resetAlgorithm() {
        stack = []; sortedPoints = []; currentIdx = 0; isFinished = false;
    }

    function preparePoints() {
        if (points.length === 0) return;
        let p0 = points[0], minIdx = 0;
        for (let i = 1; i < points.length; i++) {
            if (points[i].y > p0.y || (points[i].y === p0.y && points[i].x < p0.x)) {
                p0 = points[i]; minIdx = i;
            }
        }
        let others = points.filter((_, i) => i !== minIdx);
        others.sort((a, b) => {
            let o = getOrientation(p0, a, b);
            if (o === 0) return distSq(p0, a) - distSq(p0, b);
            return (o === 2) ? -1 : 1;
        });
        sortedPoints = [p0, ...others];
    }

    function step() {
        if (isFinished || sortedPoints.length === 0) return;
        if (currentIdx === 0) {
            stack.push(sortedPoints[0]);
            currentIdx++;
        } else if (currentIdx === 1 && sortedPoints.length > 1) {
            stack.push(sortedPoints[1]);
            currentIdx++;
        } else if (currentIdx < sortedPoints.length) {
            let p = sortedPoints[currentIdx];
            while (stack.length >= 2 && getOrientation(stack[stack.length - 2], stack[stack.length - 1], p) !== 2) {
                stack.pop();
            }
            stack.push(p);
            currentIdx++;
        } else {
            isFinished = true;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        points.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#333";
            ctx.fill();
        });
        if (stack.length > 0) {
            ctx.beginPath();
            ctx.moveTo(stack[0].x, stack[0].y);
            for (let i = 1; i < stack.length; i++) ctx.lineTo(stack[i].x, stack[i].y);
            if (isFinished && points.length >= 3) ctx.closePath();
            ctx.strokeStyle = "#4CAF50";
            ctx.lineWidth = 3;
            ctx.stroke();
            if (isFinished && points.length >= 3) {
                ctx.fillStyle = "rgba(76, 175, 80, 0.2)";
                ctx.fill();
            }
        }
        if (currentIdx < sortedPoints.length && !isFinished) {
            ctx.beginPath();
            ctx.arc(sortedPoints[currentIdx].x, sortedPoints[currentIdx].y, 8, 0, Math.PI * 2);
            ctx.strokeStyle = "#FF5722";
            ctx.stroke();
        }
    }
</script>
</body>
</html>
